<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión</title>
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="listado.css">
<link rel="stylesheet" href="revision.css">
</head>
<body data-pagina="revision.html">
<header>
  <h1>Revisión</h1>
  <div class="datos" id="datos">&nbsp;</div>
</header>
<nav id="menu"></nav>
<main>
  <section id="pruebas" class="aviso">
    <p><strong>Esta página está en pruebas.</strong></p>
    <p class="suave" id="ayuda">Todavía no está abierta para todo el mundo.</p>
    <p id="pedir" hidden><button type="button" class="boton" id="elegir">Elegir la carpeta</button></p>
    <p class="suave" id="problema" hidden></p>
  </section>
  <p id="escritura" class="estado-escritura" role="status" aria-live="polite" hidden></p>
  <section id="revision" hidden>
    <div class="pestanas-rev" id="pestanas"></div>
    <div class="tarjeta" id="tarjetaRevision">
      <select id="selCurso" hidden></select>
      <div class="filtros" id="filtros"></div>
      <p class="suave" id="resumen"></p>
      <table class="listado" id="tablaRevision">
        <thead><tr id="cabecera"></tr></thead>
        <tbody id="filas"></tbody>
      </table>
      <details class="cuadre-desplegable" id="cuadreEnComprobar" hidden>
        <summary id="resumenCuadre"></summary>
        <table class="listado">
          <thead><tr><th>Curso</th><th>Unidad</th><th>Alumno/a</th><th>Qué pasa</th><th></th></tr></thead>
          <tbody id="filasCuadre"></tbody>
        </table>
        <div id="tablasCuadre"></div>
      </details>
    </div>
    <div class="tarjeta" id="tarjetaExcel" hidden>
      <p>El Excel de Jefatura se hace en la app de hoy.</p>
      <p><a class="cambiar-app" id="enlaceExcel" target="_blank" rel="noopener">Abrir la app de hoy</a></p>
    </div>
    <div class="tarjeta" id="tarjetaOferta" hidden>
      <select id="selOferta"></select>
      <p class="suave" id="notaOferta"></p>
      <div class="caja-tabla"><table class="listado" id="tablaOferta"></table></div>
    </div>
  </section>
</main>
<p class="pie" id="version"></p>
<script src="version.js"></script>
<script src="commit.js"></script>
<script src="hoy-base.js"></script>
<script src="carpeta.js"></script>
<script src="escritura.js"></script>
<script src="medidas.js"></script>
<script src="entrar.js"></script>
<script src="revision-base.js"></script>
<script src="revision.js"></script>
<script src="buscar.js"></script>
<script src="menu-buscador.js"></script>
<script src="menu.js"></script>
<script src="actualizar-copia.js"></script>
</body>
</html>
