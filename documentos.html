<nav id="menu"></nav>
<main>
  <section id="pruebas" class="aviso">

    </div>

    <div class="cabecera-tarea" id="cabeceraTarea">
      <div class="cab-linea"><h2 id="tituloPaso">Documentos</h2><span class="slot-principal"><button type="button" class="destacado" id="botonPrincipalPaso" hidden></button></span></div>
    </div>
    <div id="mensajes"></div>
    <div id="tab-documentos"></div>
  </section>
