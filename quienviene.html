<body data-pagina="quienviene.html">
<header>
  <h1>Quién viene</h1>
  <div class="datos" id="datos">&nbsp;</div>
</header>
<nav id="menu"></nav>
<main>
  <section id="pruebas" class="aviso">
    <p><strong>Esta página está en pruebas.</strong></p>
    <p class="suave" id="ayuda">Todavía no está abierta para todo el mundo.</p>
    <p id="pedir" hidden><button type="button" class="boton" id="elegir">Elegir la carpeta</button></p>
    <p class="suave" id="problema" hidden></p>
  </section>
  <p id="escritura" class="estado-escritura" role="status" aria-live="polite" hidden></p>
  <section id="quienviene" hidden>
    <div class="qv-cabecera-web">
      <select id="selCurso" hidden aria-label="Curso"></select>
      <span class="suave"><span id="paraCambiar">Para cambiar algo:</span> <a class="cambiar-app" id="enlaceApp" target="_blank" rel="noopener">Cambiar en la app de hoy</a></span>
    </div>
    <div class="qv-pasos" id="pasos"></div>
    <div id="mensajes"></div>
    <div id="tab-quienviene">
      <div class="tarjeta">
        <p id="resolucionQuienViene" class="res-banner oculto"></p>
        <div id="panelAvanceQuienViene" class="oculto"></div>
        <div class="filtros oculto" id="filtrosQuienViene"></div>
        <p id="resumenQuienViene" class="qv-resumen"></p>
        <div id="tablaQuienViene"></div>
      </div>
    </div>
  </section>
</main>
<p class="pie" id="version"></p>
