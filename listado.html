<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listados</title>
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="listado.css">
</head>
<body data-pagina="listado.html">
<header>
  <h1>Listados</h1>
  <div class="datos" id="datos">&nbsp;</div>
</header>
<nav id="menu"></nav>
<main>
  <section id="pruebas" class="aviso">
    <p><strong>Esta página está en pruebas.</strong></p>
    <p class="suave" id="ayuda">Todavía no está abierta para todo el mundo.</p>
    <p id="pedir" hidden><button type="button" class="boton" id="elegir">Elegir la carpeta</button></p>
    <p class="suave" id="problema" hidden></p>
  </section>
  <section id="listado" class="tarjeta" hidden>
    <select id="selCurso" hidden></select>
    <select id="selUnidad"><option value="">Todo el centro</option></select>
    <div class="filtros" id="filtros"></div>
    <p class="suave" id="resumen"></p>
    <table class="listado">
      <thead><tr><th id="porNombre">Alumno/a</th><th id="porUnidad">Unidad</th><th>Etiquetas</th></tr></thead>
      <tbody id="filas"></tbody>
    </table>
  </section>
</main>
<p class="pie" id="version"></p>
<script src="version.js"></script>
<script src="commit.js"></script>
<script src="hoy-base.js"></script>
<script src="carpeta.js"></script>
<script src="medidas.js"></script>
<script src="entrar.js"></script>
<script src="listado-base.js"></script>
<script src="listado.js"></script>
<script src="buscar.js"></script>
<script src="menu-buscador.js"></script>
<script src="menu.js"></script>
<script src="actualizar-copia.js"></script>
</body>
</html>
